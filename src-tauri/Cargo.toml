[package]
name = "narrative-mind"
version = "4.0.0"
edition = "2021"
license = "MIT"

[package.metadata]
# Tauri build metadata — required by tauri-build

[workspace]
resolver = "2"
members = [
    "crates/xmgl-core",
    "crates/xmgl-agent",
    "crates/xmgl-orchestrator",
    "crates/xmgl-memory",
    "crates/xmgl-project",
    "crates/xmgl-python-bridge",
    "crates/xmgl-tauri",
]

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = "0.31"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
